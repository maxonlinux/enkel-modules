[package]
name = "enkel-module-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
[lib]
crate-type = ["cdylib"]
[dependencies]
enkel-module-sdk = { path = "../sdk", features = ["appkit"] }
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
# Completion popups use CALayer geometry/color methods even though their type is returned by AppKit.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
serde_json.workspace = true

[lints.rust]
deprecated = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
excessive_nesting = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
manual_let_else = "deny"
needless_else = "deny"
match_same_arms = "deny"
redundant_closure_for_method_calls = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[build-dependencies]
enkel-module-build = { path = "../build-support" }
