[workspace]
members = ["sdk", "console", "network", "elements", "build-support"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maxonlinux/enkel-modules"

[workspace.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSFileManager", "NSBundle", "NSURL", "NSAttributedString", "NSDictionary", "NSValue", "NSArray", "NSGeometry", "NSIndexSet", "NSNotification", "NSObject", "NSString", "NSRunLoop"
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSAppearance", "NSColorList", "NSApplication", "NSResponder", "NSEvent", "NSWindow", "NSPanel", "NSView",
    "NSControl", "NSOpenPanel", "NSSavePanel", "NSSwitch", "NSBox", "NSCell", "NSActionCell", "NSViewController", "NSSplitViewController", "NSSplitViewItem",
    "NSStackView", "NSLayoutConstraint", "NSLayoutAnchor", "NSLayoutGuide",
    "NSTableView", "NSTableColumn", "NSTableCellView", "NSTableRowView", "NSTableHeaderView", "NSTableHeaderCell",
    "NSImageView", "NSDragging", "NSDraggingSession", "NSPasteboard", "NSPasteboardItem", "NSButton", "NSButtonCell", "NSColor", "NSFont", "NSFontDescriptor", "NSAccessibility", "NSAccessibilityProtocols",
    "NSAttributedString", "NSLayoutManager", "NSTextInputClient", "NSTextStorage", "NSText", "NSTextView", "NSTextContainer", "NSTextField", "NSTextFieldCell", "NSSearchField", "NSSearchFieldCell", "NSCursor", "NSTrackingArea", "NSMenu", "NSMenuItem", "NSImage",
    "NSStringDrawing", "NSGraphics", "NSBezierPath", "NSScreen", "NSScrollView", "NSScroller", "NSClipView", "NSSplitView", "NSToolbar",
    "NSToolbarItem", "NSTrackingSeparatorToolbarItem", "NSParagraphStyle",
    "NSUserInterfaceValidation", "NSUserInterfaceLayout", "NSUserInterfaceItemIdentification", "NSRunningApplication", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAAnimation", "CAMediaTiming", "objc2-core-foundation", "objc2-core-graphics"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
