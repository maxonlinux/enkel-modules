name: Check native modules
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.1 fmt --all -- --check
      - run: cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings
      - name: Check each project independently of workspace feature unification
        run: |
          for module in console network elements; do
            cargo +1.99.1 check --locked --all-targets -p "enkel-module-$module"
          done
      - run: cargo +1.99.1 test --locked --workspace --all-targets
      - run: python3 -m py_compile scripts/release.py scripts/catalog.py scripts/develop.py
