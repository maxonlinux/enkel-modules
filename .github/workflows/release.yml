name: Publish native modules
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: official-module-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag from main
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target '${{ matrix.target }}'
      - run: rustup default 1.99.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Build and seal native packages without signing credentials
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modules-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: modules-*
          path: dist/release
          merge-multiple: true
      - name: Publish complete artifacts before updating the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/*.tar --verify-tag --title "Native modules $RELEASE_TAG" --generate-notes --prerelease
          python3 scripts/catalog.py dist/release
          gh api --method PUT repos/maxonlinux/enkel-modules/contents/catalog.json --input catalog-update.json
